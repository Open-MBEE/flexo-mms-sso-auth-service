version: 2.1
orbs:
  docker: circleci/docker@2.1.1

executors:
  machine_executor_amd64:
    machine:
      image: ubuntu-2204:2022.04.2
    environment:
      architecture: "amd64"
      platform: "linux/amd64"

jobs:
  build_and_test:
    machine:
      image: default
    working_directory: /home/circleci/flexo-mms-sso-auth-service
    steps:
      - checkout
      - run:
          name: Build and test
          command: |
            ./gradlew build
      - store_artifacts:
          path: /home/circleci/flexo-mms-sso-auth-service/build/reports/tests
      - persist_to_workspace:
          root: /home/circleci/
          paths:
            - flexo-mms-sso-auth-service/build

  deploy_snapshot:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-sso-auth-service
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: 20.10.18
      - attach_workspace:
          at: ~/
      - checkout
      - run:
          name: Login to Dockerhub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Create multi-arch builder
          command: |
            docker buildx create --name multiarch --use || docker buildx use multiarch
            docker buildx inspect --bootstrap
      - run:
          name: Build and push multi-arch docker image
          command: |
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t openmbee/flexo-mms-sso-auth-service:${CIRCLE_BRANCH#*/}-SNAPSHOT \
              -t openmbee/flexo-mms-sso-auth-service:latest \
              --push .

  deploy_release:
    executor:
      name: docker/docker
    working_directory: /home/circleci/flexo-mms-sso-auth-service
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
          version: 20.10.18
      - attach_workspace:
          at: ~/
      - checkout
      - run:
          name: Login to Dockerhub
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Create multi-arch builder
          command: |
            docker buildx create --name multiarch --use || docker buildx use multiarch
            docker buildx inspect --bootstrap
      - run:
          name: Build and push multi-arch release
          command: |
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t openmbee/flexo-mms-sso-auth-service:${CIRCLE_TAG} \
              -t openmbee/flexo-mms-sso-auth-service:latest \
              --push .

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build_and_test:
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
          context:
            - DockerHub
      - deploy_snapshot:
          requires:
            - build_and_test
          filters:
            branches:
              only: /((release|hotfix|support)/[0-9.]+(-[\w-]+(\.[0-9]+)?)?|develop)/
          context:
            - DockerHub
      - deploy_release:
          requires:
            - build_and_test
          filters:
            tags:
              only: /v[0-9.]+(-[\w-]+(\.[0-9]+)?)?/
            branches:
              ignore: /.*/
          context:
            - DockerHub
