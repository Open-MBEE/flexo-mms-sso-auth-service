spring:
  datasource:
    url: jdbc:sqlite:memory:test_db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: test-client-id
            client-secret: test-client-secret
            provider: test-provider
        provider:
          test-provider:
            issuer-uri: http://localhost:8080
            authorization-uri: http://localhost:8080/oauth/authorize
            token-uri: http://localhost:8080/oauth/token
            jwk-set-uri: http://localhost:8080/oauth/jwks
            user-info-uri: http://localhost:8080/oauth/userinfo
            user-name-attribute: sub
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

flexo:
  sparql:
    query-url: "http://localhost:3030/test_ds/sparql"
    update-url: "http://localhost:3030/test_ds/update"
    graph-store-protocol-url: "http://localhost:3030/test_ds/data"
    root-context: "http://test-context"